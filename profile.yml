server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres:5433/profile_db
    username: profile_user
    password: profile_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: profile-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
        spring.json.type.mapping: "java.lang.Long:java.lang.Long,com.uniflow.identity.kafka.event.UserRegisteredEvent:com.uniflow.profileservice.kafka.event.UserRegisteredEvent"

  # Custom application topic mappings
  topics:
    user-created: user-created
    user-deleted: user-deleted

security:
  jwt:
    secret-key: 8pFcrOSF8T9yq2ccOwkmecKcStATsrMftKCFVzdCqXeD5biqlt
    issuer: uniflow-identity-service
